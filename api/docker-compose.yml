services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mi-proyecto-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MI_PROYECTO_SQL_SA_PASSWORD:-TuContraseñaSegura123!}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data_v2:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  mongodb:
    image: mongo:8
    container_name: mi-proyecto-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-Mongo_Dev_2026!}
      MONGO_INITDB_DATABASE: mi_proyecto
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "${MONGO_ROOT_USERNAME:-admin}", "--password", "${MONGO_ROOT_PASSWORD:-Mongo_Dev_2026!}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  sqlserver_data_v2:
    name: mi-proyecto-sqlserver-data-v2
  mongodb_data:
